[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dafny-sketcher"
version = "0.1.0"
description = """
Interactive semi-automated verified program synthesis combining LLMs and symbolic reasoning for Dafny.

Quick Setup:
1. Install: uv sync && uv add --optional anthropic "anthropic>=0.25.0"
2. Set API key: export ANTHROPIC_API_KEY="your_key_here"  
3. Run: uv run python vfp/mcts_fine.py

Alternative with pip: pip install -e ".[anthropic]" && cd vfp && python3 mcts_fine.py
See [project.optional-dependencies] below for other LLM provider options.
"""
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Nada Amin", email = "namin@seas.harvard.edu"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
    # Core dependencies
    "typing-extensions>=4.0.0",
    
    # Optional LLM providers (at least one required)
    # User should install based on their preferred provider
]

[project.optional-dependencies]
# LLM Provider Options - Choose one or more:
# 
# For Anthropic Claude (Recommended):     pip install -e ".[anthropic]"
# For OpenAI GPT:                         pip install -e ".[openai]" 
# For Google Gemini:                      pip install -e ".[google]"
# For Ollama (local):                     pip install -e ".[ollama]"
# For all providers:                      pip install -e ".[all-llms]"

anthropic = [
    "anthropic>=0.25.0",
]
anthropic-bedrock = [
    "anthropic[bedrock]>=0.25.0",
]
anthropic-vertex = [
    "anthropic[vertex]>=0.25.0",
]
openai = [
    "openai>=1.0.0",
]
google = [
    "google-generativeai>=0.3.0",
]
google-vertex = [
    "google-genai>=0.1.0",
]
ollama = [
    "ollama>=0.1.0",
]
mlx = [
    "mlx-lm>=0.1.0",
]

# Convenience groups
all-llms = [
    "anthropic>=0.25.0",
    "openai>=1.0.0", 
    "google-generativeai>=0.3.0",
    "ollama>=0.1.0",
]

# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "mypy>=1.0.0",
    "flake8>=4.0.0",
]

# Full development setup with Claude (recommended)
dev-claude = [
    "dafny-sketcher[anthropic,dev]",
]

# Agents dependencies (for the agents/ directory)
agents = [
    "anthropic>=0.25.0",
    "openai>=1.0.0",
    "asyncio-extras>=1.3.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/namin/dafny-sketcher"
Repository = "https://github.com/namin/dafny-sketcher"
Issues = "https://github.com/namin/dafny-sketcher/issues"

[project.scripts]
dafny-sketcher-vfp = "vfp.mcts_fine:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vfp*", "agents*"]
exclude = ["tests*", "dafny*", "ide-vscode*", "cli*", "mcp*"]

[tool.setuptools.package-data]
vfp = ["examples/*.dfy", "specs/*.dfy", "bench/*.dfy"]

# Black configuration
[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312', 'py313']

# isort configuration
[tool.isort]
profile = "black"
line_length = 88

# MyPy configuration
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests", "vfp"]
python_files = ["test_*.py", "*_test.py", "tests.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
